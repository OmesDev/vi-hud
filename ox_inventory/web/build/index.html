<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <title>Ox Inventory</title>
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
    <!-- vi-hud theme (GTA VI style); re-add these three lines after updating ox_inventory -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/vi-theme.css">
    <!-- Tab switches to vi-hud's weapon wheel; don't let the browser also use it to move focus
         (that flashed a focus outline while the inventory closed) -->
    <script>document.addEventListener('keydown', function (e) { if (e.key === 'Tab') e.preventDefault(); }, true);</script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
